server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    # "native" = the backend is a folder on disk (config-repo), no Git server needed.
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_PATH:file:./config-repo}
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/your-user/shopstream-config.git}
          default-label: main

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
