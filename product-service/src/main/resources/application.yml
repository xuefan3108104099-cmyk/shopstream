server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: product-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  # Local fallbacks so the service can also be started from the IDE.
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/productdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PRODUCT_DB_USER:shop}
    password: ${PRODUCT_DB_PASSWORD:shop}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis-secret}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    metadata-map:
      instance: ${INSTANCE_LABEL:local}
