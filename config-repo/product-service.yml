server:
  port: 8081

spring:
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:mysql://localhost:3306/productdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PRODUCT_DB_USER:shop}
    password: ${PRODUCT_DB_PASSWORD:shop}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis-secret}
      timeout: 2s

app:
  cache:
    product-ttl-seconds: 600
