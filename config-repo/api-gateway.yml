# Gateway-specific tuning served from the config-server.
# The route table itself lives in api-gateway/src/main/resources/application.yml
# so that the gateway still boots and routes traffic if config-server is down.
spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 30s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

app:
  gateway:
    request-id-header: X-Request-Id
