# =============================================================================
# ShopStream - shared configuration served by config-server to every service.
# Anything that is truly common (Kafka connection, JSON handling, topic names)
# lives here, so a single change applies to the whole system.
# =============================================================================
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        # Each service owns its DTOs, so no class-name type headers are written.
        # The event "type" field inside the JSON payload is the contract.
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.shopstream.*,java.util.*,java.lang.*"
        # No class-name headers are exchanged, so the payload is read as a generic
        # map first; each listener then converts it to its own typed event class.
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
    listener:
      # Commit only after the listener method returned successfully -> at-least-once.
      ack-mode: record
      concurrency: 1
  jackson:
    deserialization:
      fail-on-unknown-properties: false

logging:
  pattern:
    # every log line carries the X-Request-Id that the gateway created
    level: "%5p [rid:%X{requestId:-none}]"

app:
  kafka:
    partitions: 3
    replication-factor: ${KAFKA_REPLICATION_FACTOR:1}
    topics:
      order-events: order-events
      inventory-events: inventory-events
      product-events: product-events
